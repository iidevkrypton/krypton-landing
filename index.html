<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KrypTon — Software propio, desde Zaragoza</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="ds-bundle.js"></script>
<style>
  #root { min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; }
  .hero-grid { display: grid; grid-template-columns: 1fr; gap: clamp(28px,5vw,56px); align-items: start; }
  @media (max-width: 860px) { .hero-grid { grid-template-columns: 1fr; } }
  .prod-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 24px; align-items: stretch; }
  @media (max-width: 820px) { .prod-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="sections.jsx" data-presets="react"></script>
<script type="text/babel" data-presets="react">
(function () {
const { Button, Badge, AppCard, NavBar, Footer } = window.KrypTonDesignSystem_6d2e6d;
const { Container, Section, Eyebrow } = window.KtLayout;
const Ic = window.KtIcons;

function Hero() {
  return (
    <Section className="kt-concentric" style={{ paddingTop: 'clamp(48px,6vw,80px)', paddingBottom: 'clamp(40px,5vw,64px)' }}>
      <Container>
        <div className="hero-grid">
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
            <Eyebrow>Desarrollo de software · Zaragoza</Eyebrow>
            <h1 className="kt-reveal" style={{ fontSize: 'var(--kt-fs-display)', letterSpacing: 'var(--kt-tracking-display)', lineHeight: 1.02, maxWidth: '16ch' }}>
              Construimos, publicamos y mantenemos<br /><span className="kt-gradient-text">nuestro propio software</span>.
            </h1>
            <p className="kt-reveal" style={{ fontSize: 'var(--kt-fs-lead)', color: 'var(--kt-text-muted)', maxWidth: '48ch' }}>
              La vida es demasiado corta para desarrollar algo que nadie quiere.
            </p>
          </div>

          <div className="kt-reveal" style={{ display: 'none', border: '1px solid var(--kt-line)', borderRadius: 'var(--kt-radius-xl)', background: 'var(--kt-surface)', padding: 22, flexDirection: 'column', gap: 10, alignSelf: 'start' }}>
            <span className="kt-eyebrow" style={{ marginBottom: 6 }}>Empieza aquí</span>
            <Button as="a" href="aplicaciones.html" variant="primary" size="lg" style={{ width: '100%', justifyContent: 'space-between', borderRadius: 'var(--kt-radius-md)' }}>Ver aplicaciones {Ic.arrow()}</Button>
            <Button as="a" href="contacto.html" variant="secondary" size="lg" style={{ width: '100%', justifyContent: 'space-between', borderRadius: 'var(--kt-radius-md)', background: 'var(--kt-surface-2)' }}>Contacto {Ic.arrow()}</Button>
            <hr className="kt-rule" style={{ margin: '10px 0 6px' }} />
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <a className="kt-textlink" href="aplicaciones.html" style={{ justifyContent: 'space-between' }}><span>KBook</span> {Ic.arrow({ width: 16, height: 16 })}</a>
              <a className="kt-textlink" href="aplicaciones.html" style={{ justifyContent: 'space-between' }}><span>KImpostor</span> {Ic.arrow({ width: 16, height: 16 })}</a>
            </div>
          </div>
        </div>
      </Container>
    </Section>
  );
}

function Productos() {
  return (
    <Section style={{ paddingTop: 0 }}>
      <Container>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 12, marginBottom: 28 }}>
          <div>
            <Eyebrow>Lo que hemos publicado</Eyebrow>
            <h2 style={{ fontSize: 'var(--kt-fs-h2)', marginTop: 10 }}>Dos productos, muy distintos a propósito</h2>
          </div>
          <a className="kt-textlink" href="aplicaciones.html">Ver las dos apps {Ic.arrow({ width: 16, height: 16 })}</a>
        </div>
        <div className="prod-grid">
          <AppCard tone="violet" name="KBook" glyph={<img src="assets/kbook-icon.png" alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: 'inherit' }} />}
            tagline="Reservas y citas para tu negocio de barrio"
            description="La agenda que se queda con tus clientes en tu casa: peluquerías, barberías, estética, clínicas y cualquier negocio con cita previa. También reserva de mesa en restaurantes."
            badge={<Badge tone="violet">Producto insignia</Badge>}
            cta={<Button as="a" href="aplicaciones.html" variant="primary">Conocer KBook {Ic.arrow()}</Button>} />
          <AppCard tone="turquoise" style={{ borderTopColor: '#f0babe' }} name="KImpostor" glyph={<img src="assets/kimpostor-icon.png" alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: 'inherit' }} />}
            tagline="Juego social de fiesta"
            description="Para jugar en grupo, en el sofá o en el bar. Encuentra al impostor antes de que te descubran."
            badge={<Badge tone="turquoise" style={{ borderColor: '#f0babe', color: '#f0babe' }}>Ocio</Badge>}
            cta={<a className="kt-textlink" href="aplicaciones.html">Ver KImpostor {Ic.arrow({ width: 16, height: 16 })}</a>} />
        </div>
      </Container>
    </Section>
  );
}

function Maker() {
  return (
    <Section style={{ paddingTop: 0 }}>
      <Container>
        <div style={{ borderRadius: 'var(--kt-radius-xl)', border: '1px solid var(--kt-line)', background: 'var(--kt-surface)', padding: 'clamp(28px,4vw,52px)', display: 'grid', gridTemplateColumns: 'auto 1fr', gap: 'clamp(20px,4vw,44px)', alignItems: 'center' }}>
          <img src="assets/kevin.jpg" alt="Kevin Rodríguez" style={{ width: 132, height: 132, borderRadius: 'var(--kt-radius-lg)', objectFit: 'cover', border: '1px solid var(--kt-line)', flex: 'none', display: 'block' }} />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            <Eyebrow>Quién está detrás</Eyebrow>
            <h2 style={{ fontSize: 'var(--kt-fs-h3)', fontWeight: 600 }}>Kevin Rodríguez — desarrollador y fundador</h2>
            <p style={{ color: 'var(--kt-text-muted)', maxWidth: '62ch' }}>
              KrypTon es una persona, no un departamento. Escribo el código, publico las apps y respondo el teléfono. Estar en Zaragoza no es un detalle del pie de página: significa que hablas con quien construye el producto, sin centralitas ni tickets que se pierden.
            </p>
          </div>
        </div>
      </Container>
    </Section>
  );
}

function App() {
  return (
    <>
      <NavBar active="inicio" cta={<Button as="a" href="contacto.html" variant="primary" size="sm" style={{ marginLeft: 8 }}>Contacto</Button>} />
      <main>
        <Hero />
        <Productos />
        {window.KtClosingCta({ heading: '¿Tienes una idea? Vamos a construirla', body: 'Estoy abierto a escuchar propuestas de todo tipo. Si tienes una idea para una app, hablemos y veamos cómo desarrollarla juntos.' })}
        <Maker />
      </main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
window.KtReveal();
})();
</script>
</body>
</html>
