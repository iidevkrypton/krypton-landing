<!-- @dsCard group="Website" viewport="1120x760" name="Contacto" subtitle="Direct contact — details + simple form, no backend" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — KrypTon</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<style>
  #root { min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; }
  .contact-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: clamp(28px,5vw,64px); align-items: start; }
  @media (max-width: 820px) { .contact-grid { grid-template-columns: 1fr; } }
  .detail { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--kt-line-soft); }
  .detail:last-child { border-bottom: 0; }
  .detail .ico { width: 42px; height: 42px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--kt-radius-md); background: var(--kt-surface-2); color: var(--kt-turquoise); border: 1px solid var(--kt-line); }
  .detail .k { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--kt-text-muted); }
  .detail .v { font-size: 1.0625rem; font-weight: 500; }
  .detail a.v { color: var(--kt-text); }
  .detail a.v:hover { color: var(--kt-turquoise); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="sections.jsx" data-presets="react"></script>
<script type="text/babel" data-presets="react">
(function () {
const { Button, Field, Card, NavBar, Footer } = window.KrypTonDesignSystem_6d2e6d;
const { Container, Section, Eyebrow } = window.KtLayout;
const Ic = window.KtIcons;

function ContactForm() {
  const [sent, setSent] = React.useState(false);
  return (
    <Card style={{ borderRadius: 'var(--kt-radius-xl)' }}>
      {sent ? (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 14, padding: '12px 4px' }}>
          <span style={{ width: 48, height: 48, borderRadius: '50%', background: 'rgba(0,194,168,0.16)', border: '1px solid rgba(0,194,168,0.4)', color: 'var(--kt-turquoise)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{Ic.check({ width: 22, height: 22 })}</span>
          <h3 style={{ fontSize: 'var(--kt-fs-h3)' }}>Recibido. Te contesto yo.</h3>
          <p style={{ color: 'var(--kt-text-muted)' }}>Gracias por escribir. Leo el mensaje y te respondo en persona lo antes que pueda.</p>
          <Button variant="secondary" onClick={() => setSent(false)}>Enviar otro</Button>
        </div>
      ) : (
        <form onSubmit={(e) => { e.preventDefault(); setSent(true); }} style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
          <Field label="Nombre" name="nombre" placeholder="Tu nombre" required />
          <Field label="Email" name="email" type="email" placeholder="tucorreo@ejemplo.com" required />
          <Field label="Mensaje" name="mensaje" multiline rows={5} placeholder="Cuéntame qué negocio tienes o en qué te puedo ayudar…" required />
          <Button type="submit" variant="primary" size="lg" style={{ alignSelf: 'flex-start' }}>Enviar mensaje {Ic.arrow()}</Button>
        </form>
      )}
    </Card>
  );
}

function App() {
  return (
    <>
      <NavBar active="contacto" cta={<Button as="a" href="aplicaciones.html" variant="secondary" size="sm" style={{ marginLeft: 8 }}>Aplicaciones</Button>} />
      <main>
        <Section className="kt-concentric">
          <Container>
            <div className="contact-grid">
              <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>
                <Eyebrow>Contacto</Eyebrow>
                <h1 className="kt-reveal" style={{ fontSize: 'var(--kt-fs-h1)', letterSpacing: '-0.02em' }}>Escribe y te contesto yo</h1>
                <p className="kt-reveal" style={{ fontSize: 'var(--kt-fs-lead)', color: 'var(--kt-text-muted)', maxWidth: '46ch' }}>
                  Sin formularios que van a un buzón sin dueño. Al otro lado estoy yo, Kevin, en Zaragoza. Escríbeme por donde te sea más cómodo.
                </p>
                <div className="kt-reveal" style={{ marginTop: 6 }}>
                  <div className="detail"><span className="ico">{Ic.mail()}</span><div><div className="k">Email</div><a className="v" href="mailto:administracion@devkrypton.com">administracion@devkrypton.com</a></div></div>
                  <div className="detail"><span className="ico">{Ic.phone()}</span><div><div className="k">Teléfono</div><a className="v" href="tel:+34605551487">605 55 14 87</a></div></div>
                  <div className="detail"><span className="ico">{Ic.pin()}</span><div><div className="k">Ubicación</div><span className="v">Zaragoza, España</span></div></div>
                </div>
              </div>
              <ContactForm />
            </div>
          </Container>
        </Section>
      </main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
window.KtReveal();
})();
</script>
</body>
</html>
