document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"afff3c8a-5c79-41ac-b2ae-229d3b79d3aa\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   PÉTALO — COLOR TOKENS\n   Fresh, playful wellness palette:\n   sage green (primary) · soft blue (secondary) · warm coral (accent)\n   with soft lilac & butter as playful decorative pops.\n   ============================================================ */\n:root {\n  /* --- Neutrals: warm green-tinted stone --- */\n  --stone-50:  #F4F7F4;\n  --stone-100: #E9EFEA;\n  --stone-200: #D8E1DA;\n  --stone-300: #BCC8BF;\n  --stone-400: #93A398;\n  --stone-500: #6C7D72;\n  --stone-600: #52625A;\n  --stone-700: #3D4A43;\n  --stone-800: #2B342F;\n  --stone-900: #1C221E;\n  --white:     #FFFFFF;\n\n  /* --- Primary: sage green --- */\n  --sage-50:  #EFF5F1;\n  --sage-100: #DCE9E0;\n  --sage-200: #BAD3C3;\n  --sage-300: #97BCA4;\n  --sage-400: #7FA893;\n  --sage-500: #6A9280;\n  --sage-600: #557763;\n  --sage-700: #435E4E;\n  --sage-800: #33463B;\n\n  /* --- Secondary: soft blue --- */\n  --blue-50:  #EEF4F7;\n  --blue-100: #DBE9F0;\n  --blue-200: #BBD3E0;\n  --blue-300: #A9C7D6;\n  --blue-400: #86AFC4;\n  --blue-500: #6693AC;\n  --blue-600: #517891;\n  --blue-700: #3F5E72;\n\n  /* --- Accent: warm coral (playful pop, CTAs of delight) --- */\n  --coral-50:  #FCF1ED;\n  --coral-100: #FADFD6;\n  --coral-200: #F5C0AE;\n  --coral-300: #EFA187;\n  --coral-400: #E9856A;\n  --coral-500: #DE6B4E;\n  --coral-600: #C4573B;\n\n  /* --- Decorative playful pops (use sparingly) --- */\n  --lilac-200: #DDD1EC;\n  --lilac-300: #C6B5DD;\n  --lilac-400: #AC97C9;\n  --butter-200: #F7E6BE;\n  --butter-300: #F2D6A0;\n  --butter-400: #E9BE72;\n\n  /* --- Semantic --- */\n  --success-500: #4E8C6A;\n  --success-100: #DCEDE2;\n  --warning-500: #E0A44B;\n  --warning-100: #F9EAD1;\n  --danger-500:  #D65A4E;\n  --danger-100:  #F8DDD9;\n  --info-500:    #6693AC;\n  --info-100:    #DBE9F0;\n\n  /* ==========================================================\n     SEMANTIC ALIASES — reference these in components\n     ========================================================== */\n  --brand:            var(--sage-500);\n  --brand-hover:      var(--sage-600);\n  --brand-press:      var(--sage-700);\n  --brand-soft:       var(--sage-100);\n  --brand-subtle:     var(--sage-50);\n  --on-brand:         var(--white);\n\n  --accent:           var(--coral-500);\n  --accent-hover:     var(--coral-600);\n  --accent-soft:      var(--coral-100);\n  --on-accent:        var(--white);\n\n  --secondary:        var(--blue-500);\n  --secondary-soft:   var(--blue-100);\n\n  /* Surfaces & backgrounds */\n  --bg:               #F0F4F1;   /* app canvas — soft sage-tinted */\n  --bg-warm:          #FBFAF7;   /* cream alt canvas */\n  --surface:          var(--white);\n  --surface-2:        var(--stone-50);\n  --surface-sunken:   var(--stone-100);\n  --surface-inverse:  var(--stone-900);\n\n  /* Text */\n  --text-strong:      var(--stone-900);\n  --text-body:        var(--stone-700);\n  --text-muted:       var(--stone-500);\n  --text-subtle:      var(--stone-400);\n  --text-on-dark:     var(--stone-50);\n  --text-link:        var(--sage-600);\n  --text-link-hover:  var(--sage-700);\n\n  /* Borders & lines */\n  --border:           var(--stone-200);\n  --border-strong:    var(--stone-300);\n  --border-brand:     var(--sage-300);\n  --ring:             color-mix(in oklab, var(--sage-500) 45%, transparent);\n\n  /* Focus */\n  --focus-ring:       0 0 0 3px var(--ring);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   PÉTALO — TYPOGRAPHY TOKENS\n   Display: Plus Jakarta Sans · Body: Onest · Mono: Space Mono\n   All-sans, minimal. Headings tighter tracking, body relaxed.\n   ============================================================ */\n:root {\n  --font-display: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;\n  --font-body:    'Onest', ui-sans-serif, system-ui, sans-serif;\n  --font-mono:    'Space Mono', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* Weights */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium:  500; /* @kind font */\n  --fw-semibold:600; /* @kind font */\n  --fw-bold:    700; /* @kind font */\n  --fw-extra:   800; /* @kind font */\n\n  /* Type scale (fluid-friendly rem, 16px base) */\n  --text-2xs:  0.6875rem; /* 11px */\n  --text-xs:   0.75rem;   /* 12px */\n  --text-sm:   0.875rem;  /* 14px */\n  --text-base: 1rem;      /* 16px */\n  --text-md:   1.125rem;  /* 18px */\n  --text-lg:   1.375rem;  /* 22px */\n  --text-xl:   1.75rem;   /* 28px */\n  --text-2xl:  2.25rem;   /* 36px */\n  --text-3xl:  3rem;      /* 48px */\n  --text-4xl:  3.75rem;   /* 60px */\n  --text-5xl:  4.75rem;   /* 76px */\n\n  /* Line heights */\n  --leading-tight:   1.1;\n  --leading-snug:    1.25;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* Letter spacing */\n  --tracking-tighter: -0.03em;\n  --tracking-tight:   -0.015em;\n  --tracking-normal:  0em;\n  --tracking-wide:    0.02em;\n  --tracking-caps:    0.08em; /* for uppercase eyebrows */\n\n  /* Semantic roles */\n  --font-heading: var(--font-display);\n  --font-text:    var(--font-body);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   PÉTALO — SPACING & LAYOUT TOKENS  (4px base grid)\n   ============================================================ */\n:root {\n  --space-0:  0;\n  --space-1:  0.25rem;  /* 4  */\n  --space-2:  0.5rem;   /* 8  */\n  --space-3:  0.75rem;  /* 12 */\n  --space-4:  1rem;     /* 16 */\n  --space-5:  1.25rem;  /* 20 */\n  --space-6:  1.5rem;   /* 24 */\n  --space-8:  2rem;     /* 32 */\n  --space-10: 2.5rem;   /* 40 */\n  --space-12: 3rem;     /* 48 */\n  --space-16: 4rem;     /* 64 */\n  --space-20: 5rem;     /* 80 */\n  --space-24: 6rem;     /* 96 */\n\n  /* Container widths */\n  --container-sm:  640px;\n  --container-md:  820px;\n  --container-lg:  1080px;\n  --container-xl:  1240px;\n\n  /* Section rhythm */\n  --section-y:     var(--space-24);\n  --gutter:        var(--space-6);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   PÉTALO — RADIUS & SHADOW TOKENS\n   Playful brand → generous rounding, soft low-contrast shadows.\n   ============================================================ */\n:root {\n  /* Corner radii */\n  --radius-xs:   6px;\n  --radius-sm:   10px;\n  --radius-md:   14px;\n  --radius-lg:   20px;\n  --radius-xl:   28px;\n  --radius-2xl:  36px;\n  --radius-pill: 999px;\n\n  /* Semantic radii */\n  --radius-button:  var(--radius-pill);\n  --radius-input:   var(--radius-md);\n  --radius-card:    var(--radius-lg);\n  --radius-modal:   var(--radius-xl);\n\n  /* Soft, warm-tinted elevation */\n  --shadow-xs:  0 1px 2px rgba(28,34,30,0.06);\n  --shadow-sm:  0 2px 8px rgba(28,34,30,0.06);\n  --shadow-md:  0 6px 20px rgba(28,34,30,0.08);\n  --shadow-lg:  0 16px 40px rgba(28,34,30,0.10);\n  --shadow-xl:  0 28px 64px rgba(28,34,30,0.12);\n\n  /* Colored glow — sage, for hero/brand cards */\n  --shadow-brand: 0 14px 36px -10px rgba(106,146,128,0.42);\n  --shadow-accent:0 14px 36px -10px rgba(222,107,78,0.38);\n\n  /* Focus ring already defined in colors.css as --focus-ring */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   PÉTALO — MOTION\n   Gentle, slightly springy. Fades + soft pops, never harsh.\n   Easing: cubic-bezier(.4,1.3,.6,1) for pops; ease for fades.\n   Respect reduced motion.\n   ============================================================ */\n@keyframes petalo-fade {\n  from { opacity: 0; } -0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"de0974f4-94bc-41e6-9bed-f66b82a133d2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"afff3c8a-5c79-41ac-b2ae-229d3b79d3aa\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   PÉTALO — COLOR TOKENS\n   Fresh, playful wellness palette:\n   sage green (primary) · soft blue (secondary) · warm coral (accent)\n   with soft lilac & butter as playful decorative pops.\n   ============================================================ */\n:root {\n  /* --- Neutrals: warm green-tinted stone --- */\n  --stone-50:  #F4F7F4;\n  --stone-100: #E9EFEA;\n  --stone-200: #D8E1DA;\n  --stone-300: #BCC8BF;\n  --stone-400: #93A398;\n  --stone-500: #6C7D72;\n  --stone-600: #52625A;\n  --stone-700: #3D4A43;\n  --stone-800: #2B342F;\n  --stone-900: #1C221E;\n  --white:     #FFFFFF;\n\n  /* --- Primary: sage green --- */\n  --sage-50:  #EFF5F1;\n  --sage-100: #DCE9E0;\n  --sage-200: #BAD3C3;\n  --sage-300: #97BCA4;\n  --sage-400: #7FA893;\n  --sage-500: #6A9280;\n  --sage-600: #557763;\n  --sage-700: #435E4E;\n  --sage-800: #33463B;\n\n  /* --- Secondary: soft blue --- */\n  --blue-50:  #EEF4F7;\n  --blue-100: #DBE9F0;\n  --blue-200: #BBD3E0;\n  --blue-300: #A9C7D6;\n  --blue-400: #86AFC4;\n  --blue-500: #6693AC;\n  --blue-600: #517891;\n  --blue-700: #3F5E72;\n\n  /* --- Accent: warm coral (playful pop, CTAs of delight) --- */\n  --coral-50:  #FCF1ED;\n  --coral-100: #FADFD6;\n  --coral-200: #F5C0AE;\n  --coral-300: #EFA187;\n  --coral-400: #E9856A;\n  --coral-500: #DE6B4E;\n  --coral-600: #C4573B;\n\n  /* --- Decorative playful pops (use sparingly) --- */\n  --lilac-200: #DDD1EC;\n  --lilac-300: #C6B5DD;\n  --lilac-400: #AC97C9;\n  --butter-200: #F7E6BE;\n  --butter-300: #F2D6A0;\n  --butter-400: #E9BE72;\n\n  /* --- Semantic --- */\n  --success-500: #4E8C6A;\n  --success-100: #DCEDE2;\n  --warning-500: #E0A44B;\n  --warning-100: #F9EAD1;\n  --danger-500:  #D65A4E;\n  --danger-100:  #F8DDD9;\n  --info-500:    #6693AC;\n  --info-100:    #DBE9F0;\n\n  /* ==========================================================\n     SEMANTIC ALIASES — reference these in components\n     ========================================================== */\n  --brand:            var(--sage-500);\n  --brand-hover:      var(--sage-600);\n  --brand-press:      var(--sage-700);\n  --brand-soft:       var(--sage-100);\n  --brand-subtle:     var(--sage-50);\n  --on-brand:         var(--white);\n\n  --accent:           var(--coral-500);\n  --accent-hover:     var(--coral-600);\n  --accent-soft:      var(--coral-100);\n  --on-accent:        var(--white);\n\n  --secondary:        var(--blue-500);\n  --secondary-soft:   var(--blue-100);\n\n  /* Surfaces & backgrounds */\n  --bg:               #F0F4F1;   /* app canvas — soft sage-tinted */\n  --bg-warm:          #FBFAF7;   /* cream alt canvas */\n  --surface:          var(--white);\n  --surface-2:        var(--stone-50);\n  --surface-sunken:   var(--stone-100);\n  --surface-inverse:  var(--stone-900);\n\n  /* Text */\n  --text-strong:      var(--stone-900);\n  --text-body:        var(--stone-700);\n  --text-muted:       var(--stone-500);\n  --text-subtle:      var(--stone-400);\n  --text-on-dark:     var(--stone-50);\n  --text-link:        var(--sage-600);\n  --text-link-hover:  var(--sage-700);\n\n  /* Borders & lines */\n  --border:           var(--stone-200);\n  --border-strong:    var(--stone-300);\n  --border-brand:     var(--sage-300);\n  --ring:             color-mix(in oklab, var(--sage-500) 45%, transparent);\n\n  /* Focus */\n  --focus-ring:       0 0 0 3px var(--ring);\n}\n\n/* ============================================================\n   PÉTALO — TYPOGRAPHY TOKENS\n   Display: Plus Jakarta Sans · Body: Onest · Mono: Space Mono\n   All-sans, minimal. Headings tighter tracking, body relaxed.\n   ============================================================ */\n:root {\n  --font-display: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;\n  --font-body:    'Onest', ui-sans-serif, system-ui, sans-serif;\n  --font-mono:    'Space Mono', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* Weights */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium:  500; /* @kind font */\n  --fw-semibold:600; /* @kind font */\n  --fw-bold:    700; /* @kind font */\n  --fw-extra:   800; /* @kind font */\n\n  /* Type scale (fluid-friendly rem, 16px base) */\n  --text-2xs:  0.6875rem; /* 11px */\n  --text-xs:   0.75rem;   /* 12px */\n  --text-sm:   0.875rem;  /* 14px */\n  --text-base: 1rem;      /* 16px */\n  --text-md:   1.125rem;  /* 18px */\n  --text-lg:   1.375rem;  /* 22px */\n  --text-xl:   1.75rem;   /* 28px */\n  --text-2xl:  2.25rem;   /* 36px */\n  --text-3xl:  3rem;      /* 48px */\n  --text-4xl:  3.75rem;   /* 60px */\n  --text-5xl:  4.75rem;   /* 76px */\n\n  /* Line heights */\n  --leading-tight:   1.1;\n  --leading-snug:    1.25;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* Letter spacing */\n  --tracking-tighter: -0.03em;\n  --tracking-tight:   -0.015em;\n  --tracking-normal:  0em;\n  --tracking-wide:    0.02em;\n  --tracking-caps:    0.08em; /* for uppercase eyebrows */\n\n  /* Semantic roles */\n  --font-heading: var(--font-display);\n  --font-text: 02Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <span style=\"font-size: 12px; color: var(--text-muted);\">Toca un número para venderlo o liberarlo. Los cambios se guardan en este navegador.<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"flex: 1 1 300px; max-width: 420px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"padding: 20px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px;\">\n            <sc-if value=\"{{ noSelection }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font-size: 14px; color: var(--text-muted);\">Selecciona un número de la cuadrícula.<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasSelection }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                <span style=\"font-family: var(--font-mono); font-weight: 700; font-size: 40px; color: var(--text-strong);\">Nº {{ selLabel }}<\u002Fspan>\n                <span style=\"padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{ selBadgeBg }}; color: {{ selBadgeFg }};\">{{ selStatus }}<\u002Fspan>\n              <\u002Fdiv>\n              <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-strong);\">Comprador\n                <input value=\"{{ draftBuyer }}\" sc-camel-on-change=\"{{ onBuyer }}\" sc-camel-on-key-down=\"{{ onBuyerKey }}\" placeholder=\"Nombre (opcional)\" style=\"height: 44px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid var(--border); border-radius: 14px; font: 400 15px var(--font-body); color: var(--text-strong); background: var(--surface); outline: none;\" style-focus=\"border-color: var(--sage-400); box-shadow: var(--focus-ring);\">\n              <\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-strong);\">Teléfono\n                <input type=\"tel\" value=\"{{ draftPhone }}\" sc-camel-on-change=\"{{ onPhone }}\" sc-camel-on-key-down=\"{{ onBuyerKey }}\" placeholder=\"Teléfono (opcional)\" style=\"height: 44px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid var(--border); border-radius: 14px; font: 400 15px var(--font-mono); color: var(--text-strong); background: var(--surface); outline: none;\" style-focus=\"border-color: var(--sage-400); box-shadow: var(--focus-ring);\">\n              <\u002Flabel>\n              <sc-if value=\"{{ selSold }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n                  <x-import component-from-global-scope=\"PTaloDesignSystem_7ae326.Button\" variant=\"primary\" sc-camel-on-click=\"{{ saveSale }}\" hint-size=\"auto,44px\">Guardar datos<\u002Fx-import>\n                  <x-import component-from-global-scope=\"PTaloDesignSystem_7ae326.Button\" variant=\"outline\" sc-camel-on-click=\"{{ unsell }}\" hint-size=\"auto,44px\">Liberar número<\u002Fx-import>\n                <\u002Fdiv>\n                <span style=\"font-size: 12px; color: var(--text-muted);\">Vendido el {{ selDate }}<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ selFree }}\" hint-placeholder-val=\"{{ true }}\">\n                <x-import component-from-global-scope=\"PTaloDesignSystem_7ae326.Button\" variant=\"accent\" sc-camel-on-click=\"{{ saveSale }}\" hint-size=\"auto,44px\">Marcar como vendido · {{ price }} €<\u002Fx-import>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"padding: 20px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px;\">\n            <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--text-strong);\">Ventas registradas<\u002Fspan>\n            <sc-if value=\"{{ noSales }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font-size: 13px; color: var(--text-muted);\">Aún no hay ventas.<\u002Fspan>\n            <\u002Fsc-if>\n            <div style=\"display: flex; flex-direction: column; max-height: 320px; overflow-y: auto;\">\n              <sc-for list=\"{{ sales }}\" as=\"s\" hint-placeholder-count=\"0\">\n                <button sc-camel-on-click=\"{{ s.select }}\" style=\"display: flex; align-items: center; gap: 12px; padding: 10px 4px; border: 0; border-bottom: 1px dashed var(--border); background: transparent; cursor: pointer; text-align: left;\" style-hover=\"background: var(--surface-2);\">\n                  <span style=\"font: 700 15px var(--font-mono); color: var(--coral-600); width: 32px;\">{{ s.label }}<\u002Fspan>\n                  <span style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;\"><span style=\"font-size: 14px; color: var(--text-strong);\">{{ s.buyer }}<\u002Fspan><span style=\"font: 400 12px var(--font-mono); color: var(--text-muted);\">{{ s.phone }}<\u002Fspan><\u002Fspan>\n                  <span style=\"font-size: 12px; color: var(--text-muted);\">{{ s.date }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ resetAll }}\" style=\"align-self: flex-start; margin-top: 4px; border: 0; background: transparent; padding: 4px 0; cursor: pointer; font: 600 12px var(--font-body); color: var(--danger-500);\">Borrar todas las ventas<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;organizer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sorteo solidario&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenido del boleto&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Regala una Navidad con ilusión&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenido del boleto&quot;},&quot;prize&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Cesta de Navidad valorada en 400 €&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenido del boleto&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:1,&quot;max&quot;:100,&quot;unit&quot;:&quot;€&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Contenido del boleto&quot;},&quot;contactName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Leidy&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;contactPhone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;613 92 46 03&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;}}\">\nconst KEY = 'sorteo-navidad-2026-ventas';\nconst pad = n => String(n).padStart(2, '0');\nconst DECO = (() => {\n  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;\n  const gift = (x, y, w, h, r, body, rib) => {\n    const rw = Math.max(4, w * 0.16), rh = Math.max(4, h * 0.16), lw = w * 0.34, lh = w * 0.24;\n    return { x, y, w, h, r, body, rib, rx: w / 2 - rw / 2, rw, ry: h * 0.42 - rh / 2, rh, lw, lh, ly: -lh * 0.85, l1x: w / 2 - lw + 1, l2x: w / 2 - 1 };\n  };\n  const T = ['#9C2228', '#C4484D'];\n  const tone = [[-10,150,46,40,-10],[44,222,38,34,6],[118,172,30,28,-6],[176,226,44,38,8],[240,150,28,26,-12],[236,62,30,28,-8],[118,64,26,24,12],[18,58,32,30,-10],[330,112,34,30,10],[184,110,24,22,6],[60,128,22,20,-4]]\n    .map(a => gift(...a, ...T));\n  const fg = [gift(270, 240, 32, 28, -10, '#1E4A35', '#E9BE72'), gift(300, 226, 40, 36, -6, '#E9BE72', '#1E4A35'), gift(336, 218, 46, 44, 5, '#FFF8EC', '#B42B30')];\n  const snow = (n, w, h) => Array.from({ length: n }, () => ({ x: +(rnd() * w).toFixed(1), y: +(rnd() * h).toFixed(1), d: +(1.5 + rnd() * 2.5).toFixed(1), a: +(0.3 + rnd() * 0.5).toFixed(2) }));\n  const wy = x => 2 + 9 * Math.abs(Math.sin(x / 548 * Math.PI * 5));\n  const wire = []; for (let x = 0; x <= 548; x += 4) wire.push([x, +wy(x).toFixed(2)]);\n  const colors = ['#F5DDA6', '#6FCB92', '#FFF8EC', '#FFB4A2'];\n  const bulbs = []; for (let x = 16, i = 0; x < 548; x += 26, i++) { const y = wy(x); bulbs.push({ x, y, cx: x - 2, cy: y, bx: x - 3.5, by: y + 2.5, c: colors[i % 4] }); }\n  return { gifts: [...tone, ...fg], snowMain: snow(46, 548, 270), snowStub: snow(18, 210, 270), wire, wireD: 'M' + wire.map(p => p.join(' ')).join(' L'), bulbs };\n})();\nclass Component extends DCLogic {\n  state = { view: 'boletos', mode: 'uno', current: 0, sel: null, draft: '', draftPhone: '', sales: {} };\n  componentDidMount() {\n    try { this.setState({ sales: JSON.parse(localStorage.getItem(KEY) || '{}') }); } catch (e) {}\n  }\n  save(sales) { this.setState({ sales }); try { localStorage.setItem(KEY, JSON.stringify(sales)); } catch (e) {} }\n  select(n) { const s = this.state.sales[n]; this.setState({ sel: n, draft: s ? s.buyer : '', draftPhone: s ? (s.phone || '') : '' }); }\n  renderVals() {\n    const { view, mode, current, sel, draft, sales } = this.state;\n    const p = this.props;\n    const price = p.price ?? 10;\n    const fmtDate = ts => new Date(ts).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });\n    const all = Array.from({ length: 100 }, (_, n) => ({ n, label: pad(n), sold: !!sales[n], buyer: sales[n]?.buyer || '', phone: sales[n]?.phone || '' }));\n    const soldCount = Object.keys(sales).length;\n    const selSale = sel != null ? sales[sel] : null;\n    const on = 'var(--sage-500)', off = 'transparent';\n    return {\n      organizer: p.organizer ?? 'Sorteo solidario',\n      contactName: p.contactName ?? 'Leidy',\n      contactPhone: p.contactPhone ?? '613 92 46 03',\n      headline: p.headline ?? 'Regala una Navidad con ilusión',\n      cause: p.cause ?? 'Todo lo recaudado se destina íntegramente a la recogida de alimentos y juguetes para familias de nuestro barrio.',\n      prize: p.prize ?? 'Cesta de Navidad valorada en 400 €',\n      price, goal: price * 100,\n      isBoletos: view === 'boletos', isVentas: view === 'ventas',\n      tabBoletosBg: view === 'boletos' ? on : off, tabBoletosFg: view === 'boletos' ? '#fff' : 'var(--text-body)',\n      tabVentasBg: view === 'ventas' ? on : off, tabVentasFg: view === 'ventas' ? '#fff' : 'var(--text-body)',\n      goBoletos: () => this.setState({ view: 'boletos' }),\n      goVentas: () => this.setState({ view: 'ventas' }),\n      goFlyer: () => this.setState({ view: 'flyer' }),\n      flyerSrc: /\\.dc\\.html$/i.test(decodeURIComponent(location.pathname)) ? 'Flyer Sorteo.dc.html' : 'flyer.html',\n      isFlyer: view === 'flyer',\n      tabFlyerBg: view === 'flyer' ? on : off, tabFlyerFg: view === 'flyer' ? '#fff' : 'var(--text-body)',\n      flyerRef: this.flyerRef || (this.flyerRef = React.createRef()),\n      flyerBtnLabel: this.state.flyerBusy ? 'Generando imagen…' : 'Descargar imagen',\n      downloadFlyer: async () => {\n        const w = this.flyerRef.current?.contentWindow;\n        if (!w?.__downloadFlyer || this.state.flyerBusy) return;\n        this.setState({ flyerBusy: true });\n        try {\n          const blob = await w.__downloadFlyer();\n          const url = URL.createObjectURL(blob);\n          const a = document.createElement('a'); a.href = url; a.download = 'flyer-sorteo-navidad.png';\n          document.body.appendChild(a); a.click(); a.remove();\n          setTimeout(() => URL.revokeObjectURL(url), 4000);\n        } catch (e) { console.error(e); alert('No se pudo generar la imagen. Revisa tu conexión a internet e inténtalo de nuevo.'); }\n
