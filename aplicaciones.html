<!-- @dsCard group="Website" viewport="1120x900" name="Aplicaciones" subtitle="KBook protagonist card + KImpostor secondary card" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplicaciones — KrypTon</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<style>
  #root { min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; }
  .kbook-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(24px,4vw,48px); align-items: start; }
  .args { display: grid; gap: 18px; }
  .whofor { display: flex; gap: 10px; flex-wrap: wrap; }
  @media (max-width: 860px) { .kbook-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="sections.jsx" data-presets="react"></script>
<script type="text/babel" data-presets="react">
(function () {
const { Button, Badge, Card } = window.KrypTonDesignSystem_6d2e6d;
const { Container, Section, Eyebrow } = window.KtLayout;
const Ic = window.KtIcons;

function Feature({ icon, title, children }) {
  return (
    <div className="kt-feature kt-reveal">
      <span className="ico">{icon}</span>
      <div><h4>{title}</h4><p>{children}</p></div>
    </div>
  );
}

function PageHead() {
  return (
    <Section className="kt-concentric" style={{ paddingBottom: 'clamp(32px,5vw,56px)' }}>
      <Container>
        <div style={{ maxWidth: '30ch', display: 'flex', flexDirection: 'column', gap: 18 }}>
          <Eyebrow>Aplicaciones</Eyebrow>
          <h1 className="kt-reveal" style={{ fontSize: 'var(--kt-fs-h1)', letterSpacing: '-0.02em' }}>Dos apps publicadas. Cada una para lo suyo.</h1>
          <p className="kt-reveal" style={{ fontSize: 'var(--kt-fs-lead)', color: 'var(--kt-text-muted)', maxWidth: '54ch' }}>
            Una es una herramienta de trabajo que da de comer a un negocio. La otra es para pasarlo bien un viernes. Las dos las construye y mantiene la misma persona.
          </p>
        </div>
      </Container>
    </Section>
  );
}

function KBook() {
  return (
    <Section style={{ paddingTop: 0 }}>
      <Container>
        <div style={{ borderRadius: 'var(--kt-radius-lg)', border: '1px solid var(--kt-line)', borderTop: '2px solid var(--kt-violet)', background: 'var(--kt-surface)', padding: 'clamp(28px,4vw,52px)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap', marginBottom: 8 }}>
            <span style={{ width: 56, height: 56, borderRadius: 'var(--kt-radius-md)', overflow: 'hidden', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><img src="assets/kbook-icon.png" alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} /></span>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}><h2 style={{ fontSize: 'var(--kt-fs-h2)' }}>KBook</h2></div>
              <span style={{ color: 'var(--kt-text-muted)' }}>La agenda de reservas para el negocio de barrio</span>
            </div>
            <Badge tone="violet" style={{ marginLeft: 'auto' }}>Producto insignia</Badge>
          </div>

          <div className="kbook-grid" style={{ marginTop: 28 }}>
            <div className="args">
              <Feature icon={Ic.users()} title="Tus clientes son tuyos">
                No de una plataforma. Están en tu agenda, con su historial y sus datos — y ahí se quedan.
              </Feature>
              <Feature icon={Ic.wallet()} title="Cuota fija, cero comisiones">
                Pagas lo mismo tanto si tienes diez reservas como si tienes mil. Nunca un porcentaje por cita.
              </Feature>
              <Feature icon={Ic.headset()} title="Soporte cercano y local">
                Llamas y te contesta una persona de Zaragoza, no una centralita ni un bot con guion.
              </Feature>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
              <div style={{ borderRadius: 'var(--kt-radius-lg)', border: '1px solid var(--kt-line)', background: 'var(--kt-bg-raise)', padding: 24 }}>
                <span className="kt-eyebrow" style={{ color: 'var(--kt-text-muted)' }}>Para quién es</span>
                <div className="whofor" style={{ marginTop: 14 }}>
                  {['Peluquerías','Barberías','Estética','Clínicas','Cita previa','Restaurantes (mesa)'].map(t =>
                    <Badge key={t} tone="neutral">{t}</Badge>)}
                </div>
              </div>
              <Button as="a" href="contacto.html" variant="primary" size="lg" style={{ alignSelf: 'flex-start' }}>Quiero KBook para mi negocio {Ic.arrow()}</Button>
            </div>
          </div>
        </div>
      </Container>
    </Section>
  );
}

function KImpostor() {
  return (
    <Section style={{ paddingTop: 0 }}>
      <Container>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
          <span className="kt-eyebrow" style={{ color: '#f0babe' }}>Y para desconectar</span>
          <span style={{ flex: 1, height: 1, background: 'var(--kt-line-soft)' }}></span>
        </div>
        <div style={{ maxWidth: 560 }}>
          <Card tone="turquoise" interactive style={{ borderRadius: 'var(--kt-radius-xl)', borderColor: 'var(--kt-line)', borderTop: '2px solid #f0babe' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 14 }}>
              <span style={{ width: 56, height: 56, borderRadius: 'var(--kt-radius-md)', overflow: 'hidden', flex: 'none', display: 'inline-flex' }}><img src="assets/kimpostor-icon.png" alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} /></span>
              <div>
                <h3 style={{ fontSize: 'var(--kt-fs-h3)' }}>KImpostor</h3>
                <span style={{ color: 'var(--kt-text-muted)', fontSize: 'var(--kt-fs-small)' }}>Juego social de fiesta</span>
              </div>
              <Badge tone="turquoise" style={{ marginLeft: 'auto', borderColor: '#f0babe', color: '#f0babe' }}>Ocio</Badge>
            </div>
            <p style={{ color: 'var(--kt-text-muted)' }}>
              Juego de deducción social para jugar en grupo con un solo móvil. Todos reciben la misma palabra… menos el impostor, que recibe otra. Habla, observa y vota: descubre al impostor antes de que se acabe el tiempo — o, si te toca a ti, disimula y no te dejes pillar.
            </p>
            <ul style={{ listStyle: 'none', margin: '4px 0 0', padding: 0, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px 18px' }}>
              {[
                'De 3 a 8+ jugadores en un mismo móvil',
                'Sin conexión — juega donde quieras',
                'Más de 400 palabras en 4 categorías',
                'Temporizador y nº de impostores configurables',
              ].map((t) => (
                <li key={t} style={{ display: 'flex', gap: 9, alignItems: 'flex-start', color: 'var(--kt-text-muted)', fontSize: 'var(--kt-fs-small)' }}>
                  <span style={{ color: '#f0babe', flex: 'none', marginTop: 2 }}>{Ic.check({ width: 16, height: 16 })}</span>{t}
                </li>
              ))}
            </ul>
            <div style={{ marginTop: 20, display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
              <Button as="a" href="https://play.google.com/store/apps/details?id=com.devkrypton.k_impostor" target="_blank" rel="noopener" variant="secondary" style={{ borderColor: 'rgba(240,186,190,0.5)', color: '#f0babe' }}>Descargar en Google Play {Ic.arrow({ width: 16, height: 16 })}</Button>
              <span style={{ color: 'var(--kt-text-lavender)', fontSize: 'var(--kt-fs-small)' }}>Gratis · Android · ES / EN</span>
            </div>
          </Card>
        </div>
      </Container>
    </Section>
  );
}

function App() {
  return (
    <>
      <NavBarEl />
      <main>
        <PageHead />
        <KBook />
        <KImpostor />
        {window.KtClosingCta({ heading: '¿KBook para tu negocio? ¿O solo curiosidad?', body: 'Cuéntame qué tienes entre manos y te digo si KBook encaja. Te contesto yo, sin rodeos.' })}
      </main>
      <FooterEl />
    </>
  );
}
const { NavBar, Footer } = window.KrypTonDesignSystem_6d2e6d;
function NavBarEl() { return <NavBar active="aplicaciones" cta={<Button as="a" href="contacto.html" variant="primary" size="sm" style={{ marginLeft: 8 }}>Contacto</Button>} />; }
function FooterEl() { return <Footer />; }

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
window.KtReveal();
})();
</script>
</body>
</html>
