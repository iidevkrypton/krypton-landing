<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abriendo KBook...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #15112E;
      color: #948CC4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 32px 24px;
      gap: 18px;
    }

    .marca {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(135deg, #6C4DFF, #00C2A8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: #6C4DFF; /* fallback visible — nunca color:transparent */
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(108, 77, 255, 0.25);
      border-top-color: #6C4DFF;
      border-radius: 50%;
      animation: giro 0.9s linear infinite;
    }

    @keyframes giro { to { transform: rotate(360deg); } }

    p { font-size: 1rem; color: #948CC4; max-width: 320px; line-height: 1.4; }

    .acciones {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
      width: 100%;
      max-width: 320px;
    }

    a.btn {
      display: block;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    a.primario { background: #6C4DFF; color: #fff; }
    a.secundario { border: 1px solid #352D5C; color: #D2CCF2; }

    .pie { margin-top: 10px; font-size: 0.75rem; color: #948CC4; }
  </style>
  <script>
    (function () {
      var PACKAGE = 'com.devkrypton.kbook';
      var PLAY_URL = 'https://play.google.com/store/apps/details?id=' + PACKAGE;

      var id = new URLSearchParams(window.location.search).get('id');
      if (!id) { document.title = 'Enlace no válido'; return; }

      var esAndroid = /android/i.test(navigator.userAgent || '');

      // URL que abre la app. En Android intent:// (lo respeta Samsung Browser y cae
      // solo a Play Store si no está instalada); en iOS/escritorio, el esquema propio.
      var abrirUrl = esAndroid
        ? 'intent://book/' + encodeURIComponent(id) +
          '#Intent;scheme=kbook;package=' + PACKAGE +
          ';S.browser_fallback_url=' + encodeURIComponent(PLAY_URL) + ';end'
        : 'kbook://book/' + encodeURIComponent(id);

      // El botón "Abrir en la app" usa la misma URL (un toque la abre con seguridad,
      // por si el navegador bloquea el intento automático sin gesto del usuario).
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('abrirApp').setAttribute('href', abrirUrl);
      });

      // Intento automático al cargar (funciona en muchos navegadores; otros exigen toque)
      window.location.href = abrirUrl;
    })();
  </script>
</head>

<body>
  <div class="marca">KBook</div>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Abriendo la app…</p>

  <div class="acciones" id="acciones">
    <a class="btn primario" id="abrirApp" href="#">Abrir en la app</a>
    <a class="btn secundario"
       href="https://play.google.com/store/apps/details?id=com.devkrypton.kbook"
       target="_blank" rel="noopener">Descargar KBook en Google Play</a>
  </div>

  <div class="pie">Hecho en Zaragoza · KrypTon</div>
</body>

</html>
